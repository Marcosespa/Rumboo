<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;padding:16px;">
<div id="root"></div>
<script type="text/babel">
const { Field, SelectField, TextAreaField, SegmentedControl } = window.RumboDesignSystem_252059;
function Demo() {
  const [mode, setMode] = React.useState("login");
  const [kind, setKind] = React.useState("Gasto");
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", alignItems: "center" }}>
        <SegmentedControl
          options={[{ value: "login", label: "Entrar" }, { value: "register", label: "Crear cuenta" }]}
          value={mode}
          onChange={setMode}
        />
        <SegmentedControl options={["Gasto", "Cobro", "Vehículo"]} value={kind} onChange={setKind} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        <Field label="Usuario o correo" placeholder="Ej. marcos o tu correo"></Field>
        <SelectField
          label="Vehículo"
          options={[{ value: "", label: "Sin vehículo" }, { value: "1", label: "Turbo Azul · ABC123" }]}
        ></SelectField>
      </div>
      <TextAreaField
        label="Nota de seguimiento"
        placeholder="Ej. La empresa dijo que revisa si ya le consignó al transportista."
      ></TextAreaField>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
