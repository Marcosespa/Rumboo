<!-- @dsCard group="Spacing" viewport="700x180" name="Radios" subtitle="Controles 16 · subtarjetas 24 · tarjetas 28 · paneles 32 · pill 999" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:16px;">
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;">
  <div style="text-align:center;">
    <div style="height:72px;border-radius:16px;border:1.5px solid var(--color-primary);background:var(--color-primary-subtle);"></div>
    <p style="margin:8px 0 0;font-size:11px;color:var(--color-mist);">--radius-control<br><strong style="color:var(--color-ink);">16px</strong></p>
  </div>
  <div style="text-align:center;">
    <div style="height:72px;border-radius:24px;border:1.5px solid var(--color-primary);background:var(--color-cloud-soft);"></div>
    <p style="margin:8px 0 0;font-size:11px;color:var(--color-mist);">--radius-subcard<br><strong style="color:var(--color-ink);">24px</strong></p>
  </div>
  <div style="text-align:center;">
    <div style="height:72px;border-radius:28px;border:1.5px solid var(--color-primary);background:var(--color-paper);"></div>
    <p style="margin:8px 0 0;font-size:11px;color:var(--color-mist);">--radius-card<br><strong style="color:var(--color-ink);">28px</strong></p>
  </div>
  <div style="text-align:center;">
    <div style="height:72px;border-radius:32px;border:1.5px solid var(--color-primary);background:var(--color-ink);"></div>
    <p style="margin:8px 0 0;font-size:11px;color:var(--color-mist);">--radius-panel<br><strong style="color:var(--color-ink);">32px</strong></p>
  </div>
  <div style="text-align:center;">
    <div style="height:72px;display:flex;align-items:center;justify-content:center;">
      <div style="height:40px;width:100%;border-radius:999px;border:1.5px solid var(--color-primary);background:var(--color-accent-subtle);"></div>
    </div>
    <p style="margin:8px 0 0;font-size:11px;color:var(--color-mist);">--radius-pill<br><strong style="color:var(--color-ink);">999px</strong></p>
  </div>
</div>
</body>
</html>
