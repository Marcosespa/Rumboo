<!-- @dsCard group="Spacing" viewport="700x160" name="Escala de espaciado" subtitle="Base 4px; gutter 20px; gap entre secciones 16px; tap mínimo 44px" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:18px 20px;">
<div style="display:flex;flex-direction:column;gap:8px;">
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="width:120px;font-size:11px;color:var(--color-mist);">--space-1 · 4px</span>
    <span style="height:14px;width:4px;background:var(--color-primary);border-radius:2px;"></span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="width:120px;font-size:11px;color:var(--color-mist);">--space-2 · 8px</span>
    <span style="height:14px;width:8px;background:var(--color-primary);border-radius:2px;"></span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="width:120px;font-size:11px;color:var(--color-mist);">--space-3 · 12px</span>
    <span style="height:14px;width:12px;background:var(--color-primary);border-radius:2px;"></span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="width:120px;font-size:11px;color:var(--color-mist);">--space-4 · 16px</span>
    <span style="height:14px;width:16px;background:var(--color-primary);border-radius:2px;"></span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="width:120px;font-size:11px;color:var(--color-mist);">--space-6 · 24px</span>
    <span style="height:14px;width:24px;background:var(--color-primary);border-radius:2px;"></span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="width:120px;font-size:11px;color:var(--color-mist);">--tap-min · 44px</span>
    <span style="height:14px;width:44px;background:var(--color-accent);border-radius:2px;"></span>
  </div>
</div>
</body>
</html>
