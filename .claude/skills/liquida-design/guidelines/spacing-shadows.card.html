<!-- @dsCard group="Spacing" viewport="700x170" name="Sombras y elevación" subtitle="Sombras bajas y cálidas; hover = lift -2px" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--color-cloud-soft);">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;">
  <div style="border-radius:20px;background:var(--color-paper);border:1px solid var(--color-line);box-shadow:var(--shadow-xs);padding:14px;text-align:center;">
    <p style="margin:0;font-size:11px;color:var(--color-mist);">--shadow-xs</p>
    <p style="margin:4px 0 0;font-size:12px;font-weight:600;color:var(--color-ink);">chips, iconos</p>
  </div>
  <div style="border-radius:20px;background:var(--color-paper);border:1px solid var(--color-line);box-shadow:var(--shadow-card);padding:14px;text-align:center;">
    <p style="margin:0;font-size:11px;color:var(--color-mist);">--shadow-card</p>
    <p style="margin:4px 0 0;font-size:12px;font-weight:600;color:var(--color-ink);">tarjetas</p>
  </div>
  <div style="border-radius:20px;background:var(--color-paper);border:1px solid var(--color-line);box-shadow:var(--shadow-hover);padding:14px;text-align:center;transform:translateY(-2px);">
    <p style="margin:0;font-size:11px;color:var(--color-mist);">--shadow-hover</p>
    <p style="margin:4px 0 0;font-size:12px;font-weight:600;color:var(--color-ink);">hover + lift</p>
  </div>
  <div style="border-radius:20px;background:var(--color-ink);box-shadow:var(--shadow-hero);padding:14px;text-align:center;">
    <p style="margin:0;font-size:11px;color:rgba(250,248,244,0.6);">--shadow-hero</p>
    <p style="margin:4px 0 0;font-size:12px;font-weight:600;color:var(--color-paper);">panel oscuro</p>
  </div>
</div>
</body>
</html>
