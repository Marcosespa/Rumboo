<!-- @dsCard group="Type" viewport="700x230" name="Inter — UI y cuerpo" subtitle="Cuerpo 16px mínimo; controles 14px; overlines en mayúsculas" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:18px 20px;">
<div style="display:flex;flex-direction:column;gap:10px;">
  <div style="display:flex;align-items:baseline;gap:16px;">
    <span style="font-size:16px;line-height:1.5;color:var(--color-ink);">Lo que realmente te queda este mes.</span>
    <span style="font-size:11px;color:var(--color-mist);flex:none;">--text-body · 16px / 400</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;">
    <span style="font-size:14px;font-weight:600;color:var(--color-ink);">Estación Terpel La 80</span>
    <span style="font-size:11px;color:var(--color-mist);flex:none;">--text-base · 14px / 600 — títulos de fila</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;">
    <span style="font-size:14px;color:var(--color-mist);">Gasolina · 10 jun</span>
    <span style="font-size:11px;color:var(--color-mist);flex:none;">--text-base · 14px / 400 mist — meta</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;">
    <span style="font-size:13px;color:var(--color-mist);">Hace 2 días · Turbo Azul</span>
    <span style="font-size:11px;color:var(--color-mist);flex:none;">--text-sm · 13px — captions</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;">
    <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.2em;color:var(--color-mist);">Dashboard</span>
    <span style="font-size:11px;color:var(--color-mist);flex:none;">--text-xs · 11px / 600 / 0.2em — overline</span>
  </div>
</div>
</body>
</html>
