<!-- @dsCard group="Colors" viewport="700x230" name="Neutros papel" subtitle="Fondos cálidos tipo papel, texto y líneas" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:14px;">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:52px;background:var(--color-ink);"></div>
    <div style="padding:7px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-ink<br><strong style="color:var(--color-ink);">#1C1C1A</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:52px;background:var(--color-stone);"></div>
    <div style="padding:7px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-stone<br><strong style="color:var(--color-ink);">#4F4E49</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:52px;background:var(--color-mist);"></div>
    <div style="padding:7px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-mist<br><strong style="color:var(--color-ink);">#6B6962</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:52px;background:var(--color-faint);"></div>
    <div style="padding:7px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-faint<br><strong style="color:var(--color-ink);">#9B988E</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:52px;background:var(--color-paper);"></div>
    <div style="padding:7px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-paper<br><strong style="color:var(--color-ink);">#FAF8F4</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:52px;background:var(--color-cloud-soft);"></div>
    <div style="padding:7px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-cloud-soft<br><strong style="color:var(--color-ink);">#F1EDE4</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:52px;background:var(--color-cloud);"></div>
    <div style="padding:7px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-cloud<br><strong style="color:var(--color-ink);">#EAE5DA</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:52px;background:var(--color-line);"></div>
    <div style="padding:7px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-line<br><strong style="color:var(--color-ink);">#E7E2D7</strong></div>
  </div>
</div>
</body>
</html>
