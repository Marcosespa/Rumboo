<!-- @dsCard group="Colors" viewport="700x150" name="Ámbar señal — acento" subtitle="Reservado para el CTA principal de tomar foto" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:14px;">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:64px;background:var(--color-accent);"></div>
    <div style="padding:8px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-accent<br><strong style="color:var(--color-ink);">#F5A623</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:64px;background:var(--color-accent-dark);"></div>
    <div style="padding:8px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-accent-dark<br><strong style="color:var(--color-ink);">#C97F0A</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:64px;background:var(--color-accent-subtle);"></div>
    <div style="padding:8px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-accent-subtle<br><strong style="color:var(--color-ink);">#FBF1DC</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:64px;background:var(--color-accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--color-on-accent);">Tomar foto</div>
    <div style="padding:8px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-on-accent<br><strong style="color:var(--color-ink);">#3D2A05</strong></div>
  </div>
</div>
</body>
</html>
