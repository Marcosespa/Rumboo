<!-- @dsCard group="Type" viewport="700x170" name="Lenguaje operativo" subtitle="Palabras del día a día, nunca jerga contable" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:16px 20px;">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;">
  <div>
    <p style="margin:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.16em;color:var(--color-success);">Sí se dice</p>
    <p style="margin:8px 0 0;font-size:15px;line-height:1.7;color:var(--color-ink);">«Te queda» · «Entró» · «Salió»<br>«Te deben» · «Ya me pagaron»<br>«Toma una foto y listo»</p>
  </div>
  <div>
    <p style="margin:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.16em;color:var(--color-error);">No se dice</p>
    <p style="margin:8px 0 0;font-size:15px;line-height:1.7;color:var(--color-mist);text-decoration:line-through;">«Balance neto» · «Ingresos brutos»<br>«Cuentas por cobrar» · «Flujo de caja»<br>«Conciliación contable»</p>
  </div>
</div>
</body>
</html>
