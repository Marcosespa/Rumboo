<!-- @dsCard group="Colors" viewport="700x150" name="Azul ruta — primario" subtitle="Confianza y señalización vial; acciones y enlaces" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:14px;">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:64px;background:var(--color-primary-dark);"></div>
    <div style="padding:8px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-primary-dark<br><strong style="color:var(--color-ink);">#0E3260</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:64px;background:var(--color-primary);"></div>
    <div style="padding:8px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-primary<br><strong style="color:var(--color-ink);">#1A4F8B</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:64px;background:var(--color-primary-soft);"></div>
    <div style="padding:8px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-primary-soft<br><strong style="color:var(--color-ink);">#3F77BE</strong></div>
  </div>
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--color-line);">
    <div style="height:64px;background:var(--color-primary-subtle);"></div>
    <div style="padding:8px 10px;background:var(--color-paper);font-size:11px;color:var(--color-mist);">--color-primary-subtle<br><strong style="color:var(--color-ink);">#E3EDF8</strong></div>
  </div>
</div>
</body>
</html>
