<!-- @dsCard group="Brand" viewport="700x200" name="Logo — cóndor andino" subtitle="Cóndor de perfil con collar ámbar; siempre junto al wordmark" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:16px;">
<div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;height:168px;">
  <div style="border-radius:20px;border:1px solid var(--color-line);background:var(--color-paper);display:flex;align-items:center;justify-content:center;">
    <img src="../assets/logos/condor.png" alt="Logo de Rumbo: cóndor andino con collar ámbar" style="max-height:130px;max-width:85%;object-fit:contain;">
  </div>
  <div style="border-radius:20px;border:1px solid var(--color-line);background:var(--color-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;">
    <img src="../assets/logos/condor-sm.png" alt="Logo pequeño de Rumbo" style="height:48px;object-fit:contain;">
    <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;color:var(--color-paper);">RUMBO</span>
  </div>
  <div style="border-radius:20px;border:1px solid var(--color-line);background:var(--color-cloud-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;">
    <span class="r-brandchip"><img src="../assets/logos/condor-sm.png" alt="" style="height:24px;width:24px;object-fit:contain;">Rumbo</span>
    <span style="font-size:11px;color:var(--color-mist);">chip de marca en header</span>
  </div>
</div>
</body>
</html>
