<!-- @dsCard group="Components" viewport="700x400" name="Feedback & states" subtitle="Pills de estado, chips de filtro, alertas y vacíos" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;padding:16px;">
<div id="root"></div>
<script type="text/babel">
const { StatusPill, FilterChip, AlertCard, EmptyState, Button, Icon } = window.RumboDesignSystem_252059;
function Demo() {
  const [filter, setFilter] = React.useState("all");
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        <StatusPill status="ok"></StatusPill>
        <StatusPill status="attention"></StatusPill>
        <StatusPill status="critical" withIcon></StatusPill>
        <StatusPill status="critical" solid>Urgente</StatusPill>
        <StatusPill status="success">Pagado</StatusPill>
        <StatusPill status="warning">Por vencer</StatusPill>
        <span style={{ width: 12 }}></span>
        <FilterChip active={filter === "all"} onClick={() => setFilter("all")}>Todas</FilterChip>
        <FilterChip active={filter === "critical"} onClick={() => setFilter("critical")}>Urgentes</FilterChip>
        <FilterChip active={filter === "attention"} onClick={() => setFilter("attention")}>Atención</FilterChip>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", gap: 14, alignItems: "start" }}>
        <AlertCard
          severity="critical"
          title="SOAT vencido"
          detail="El SOAT de Turbo Azul venció el 2 de junio. Renuévalo para evitar multas."
          meta="documento · 2 de junio de 2026"
          actions={
            <Button variant="secondary"><Icon name="CheckCircle2" /> Resolver</Button>
          }
        ></AlertCard>
        <EmptyState icon="Fuel" text="Aún no hay gastos guardados. Sube una foto para empezar."></EmptyState>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
